databaseChangeLog:
  - changeSet:
      id: 1
      author: your_name
      changes:
        - createTable:
            tableName: example
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(255)
  - changeSet:
      id: 2
      author: syed musaib
      changes:
        - createTable:
            tableName: parking_log
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: license_plate
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: entry_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: exit_time
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: status
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
                    checkConstraint: "status IN ('IN', 'OUT')"

        - createIndex:
            indexName: idx_license_plate_status
            tableName: parking_log
            columns:
              - column:
                  name: license_plate
              - column:
                  name: status